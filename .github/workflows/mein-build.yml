name: Mein Build
on:
  push:
    branches: [mc-update]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: meteor-client-26.3
          path: build/libs/*.jar
